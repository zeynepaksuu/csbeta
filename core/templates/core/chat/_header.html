{% if session %}
  <div class="min-w-0">
    <div class="text-sm font-semibold truncate">{{ session }}</div>
    <div class="text-[11px] text-slate-500">{{ session.created_at|date:"d.m.Y H:i" }} tarihinde başladı</div>
  </div>
  <span class="badge badge-muted shrink-0 normal-case">{{ session.company.name|default:"Firmasız" }}</span>
{% else %}
  <div class="text-sm font-semibold">Yeni sohbet</div>
  <span class="text-[11px] text-slate-500">Firmayı seç ve ilk soruyu sor</span>
{% endif %}
