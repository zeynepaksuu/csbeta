<div id="prompt-card" class="card space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="card-title">Firma talimatları</h2>
    <button class="btn" hx-get="{% url 'core:company_prompt' company.pk %}?edit=1" hx-target="#prompt-card" hx-swap="outerHTML">Düzenle</button>
  </div>
  {% if company.system_prompt %}
    <div class="text-sm text-slate-300 whitespace-pre-line bg-slate-900 border border-border rounded-lg px-3 py-2">{{ company.system_prompt }}</div>
  {% else %}
    <div class="text-sm text-slate-500">Bu firmaya özel talimat yok. Ton, kurallar, yasaklı konular gibi şeyleri buraya yazabilirsin.</div>
  {% endif %}

  <div>
    <div class="flex items-center justify-between mb-1">
      <span class="text-xs font-medium text-slate-400">Agent'a giden tam system prompt</span>
      <a href="{% url 'core:agent_settings' %}?company={{ company.pk }}" class="text-[11px] text-blue-400 hover:text-blue-300">System prompt'u düzenle &rarr;</a>
    </div>
    <pre class="text-xs text-emerald-300 bg-slate-900 border border-border rounded-lg p-3 whitespace-pre-wrap max-h-[480px] overflow-y-auto">{{ full_system_prompt }}</pre>
  </div>
</div>
