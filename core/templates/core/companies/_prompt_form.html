<form id="prompt-card" class="card space-y-3"
      hx-post="{% url 'core:company_prompt' company.pk %}" hx-target="this" hx-swap="outerHTML"
      hx-disabled-elt="find button[type=submit]">
  <div class="flex items-center justify-between">
    <h2 class="card-title">Firma talimatları</h2>
    <span class="text-[11px] text-slate-500">{{ company.name }}</span>
  </div>
  {{ form.system_prompt }}
  <p class="text-[11px] text-slate-500">{{ form.system_prompt.help_text }} System prompt'un sonuna eklenir.</p>
  {% for error in form.system_prompt.errors %}<p class="text-[11px] text-rose-400">{{ error }}</p>{% endfor %}
  <div class="flex justify-end gap-2">
    <button type="button" class="btn" hx-get="{% url 'core:company_prompt' company.pk %}" hx-target="#prompt-card" hx-swap="outerHTML">Vazgeç</button>
    <button type="submit" class="btn-primary">Kaydet</button>
  </div>
</form>
